
name: PC Virtual Completo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc-virtual:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Instalar ambiente gráfico
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            tigervnc-standalone-server \
            tigervnc-tools \
            dbus-x11 \
            curl \
            ca-certificates

      - name: Configurar senha VNC
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASSWORD" ]; then
            echo "Configure o segredo VNC_PASSWORD."
            exit 1
          fi

          mkdir -p "$HOME/.vnc"
          printf '%s' "$VNC_PASSWORD" |
            vncpasswd -f > "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"

      - name: Configurar área de trabalho
        shell: bash
        run: |
          mkdir -p "$HOME/.vnc"

          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec dbus-launch --exit-with-session startxfce4
          EOF

          chmod +x "$HOME/.vnc/xstartup"

      - name: Iniciar servidor VNC
        shell: bash
        run: |
          vncserver :1 \
            -localhost yes \
            -geometry 1280x720 \
            -depth 24

          sleep 5
          vncserver -list

      - name: Instalar ngrok
        shell: bash
        run: |
          curl -sSL \
            https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc \
            >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com \
            buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Abrir túnel remoto
        shell: bash
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "Configure o segredo NGROK_AUTHTOKEN."
            exit 1
          fi

          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          # Mantém o VNC restrito ao próprio computador.
          # O túnel TCP aponta para a porta local 5901.
          nohup ngrok tcp 127.0.0.1:5901 \
            --log=stdout > "$HOME/ngrok.log" 2>&1 &

          sleep 10
          cat "$HOME/ngrok.log"

      - name: Manter ambiente ativo
        shell: bash
        run: |
          echo "PC virtual iniciado."
          echo "Confira os logs do ngrok."
          sleep infinity
          
